server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Hardening
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Long cache on hashed assets
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|ico|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # ---- Svelte SPA at /svelte ----
    # Redirect bare /svelte -> /svelte/
    location = /svelte { return 301 /svelte/; }
    location /svelte/ {
        try_files $uri /svelte/index.html;
    }

    # ---- React SPA at /react ----
    location = /react { return 301 /react/; }
    location /react/ {
        try_files $uri /react/index.html;
    }
}
